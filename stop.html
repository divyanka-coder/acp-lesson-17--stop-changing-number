<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <body>
        <h1 style="margin-bottom: 30px; color:crimson;border:5px gold solid;background-color: antiquewhite;">Click on the number below</h1>
        <div id="number">0</div>
        <p id="hint">Click the number to start</p>
    
        <script>
            var numberEl = document.getElementById("number");
            var hintEl = document.getElementById("hint");
            let timer = null;

            function randomNumber() {
                return Math.floor(Math.random() * 100) + 1; // 1 to 100
            }

            numberEl.addEventListener("click", () => {
                if (timer === null) {
                    
                    timer = setInterval(() => {
                        numberEl.textContent = randomNumber();
                    }, 50);
                    hintEl.textContent = "Click again to stop";
                } else {
                   
                    clearInterval(timer);
                    timer = null;
                    hintEl.textContent = "Click to start again";
                }
            });
        </script>
    </body>
</body>
</html>
